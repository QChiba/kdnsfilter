name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test and build all architectures
        run: NATIVE=1 scripts/build.sh ci all
      - name: Shellcheck
        run: shellcheck -s sh scripts/*.sh dist/S80kdnsfilter dist/50-kdnsfilter.sh
