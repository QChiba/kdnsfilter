name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test and build
        run: NATIVE=1 scripts/build.sh "${GITHUB_REF_NAME#v}" all
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "kdnsfilter $GITHUB_REF_NAME" \
            bin/kdnsfilter_linux_*.tar.gz bin/SHA256SUMS
